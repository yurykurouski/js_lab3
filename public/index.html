<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking System</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🏨 Hotel Booking System</h1>
            <nav class="nav">
                <button class="nav-btn active" id="rooms" onclick="showSection('rooms')">Available Rooms</button>
                <button class="nav-btn" id="bookings" onclick="showSection('bookings')">My Bookings</button>
                <button class="nav-btn" id="book" onclick="showSection('book')">Make Booking</button>
            </nav>
        </header>

        <main class="main">
            <!-- Rooms Section -->
            <section id="rooms-section" class="section active">
                <div class="section-header">
                    <h2>Available Rooms</h2>
                    <div class="filters">
                        <button class="filter-btn active" onclick="filterRooms('all')">All Rooms</button>
                        <button class="filter-btn" onclick="filterRooms('standard')">Standard</button>
                        <button class="filter-btn" onclick="filterRooms('deluxe')">Deluxe</button>
                    </div>
                </div>
                <div id="rooms-grid" class="rooms-grid">
                    <!-- Rooms will be loaded here -->
                </div>
            </section>

            <!-- Bookings Section -->
            <section id="bookings-section" class="section">
                <div class="section-header">
                    <h2>My Bookings</h2>
                    <button class="btn btn-secondary" onclick="loadBookings()">Refresh</button>
                </div>
                <div id="bookings-list" class="bookings-list">
                    <!-- Bookings will be loaded here -->
                </div>
            </section>

            <!-- Book Room Section -->
            <section id="book-section" class="section">
                <div class="section-header">
                    <h2>Make a Booking</h2>
                </div>
                <form id="booking-form" class="booking-form">
                    <div class="form-group">
                        <label for="room-select">Select Room Type:</label>
                        <select id="room-select" name="roomId" required>
                            <option value="">Choose a room type...</option>
                        </select>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="checkin-date">Check-in Date:</label>
                            <input type="date" id="checkin-date" name="checkInDate" required value="2025-10-11">
                        </div>
                        
                        <div class="form-group">
                            <label for="checkout-date">Check-out Date:</label>
                            <input type="date" id="checkout-date" name="checkOutDate" required value="2025-10-13">
                        </div>
                    </div>

                    <div class="form-group">
                        <h3>Payment Information</h3>
                        <div class="payment-info">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="card-number">Card Number:</label>
                                    <input type="text" id="card-number" name="cardNumber" placeholder="1234 5678 9012 3456" required value="1234567890123456">
                                </div>
                                
                                <div class="form-group">
                                    <label for="expiry-date">Expiry Date:</label>
                                    <input type="text" id="expiry-date" name="expiryDate" placeholder="MM/YY" required value="12/25">
                                </div>
                            </div>
                            
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="cvv">CVV:</label>
                                    <input type="text" id="cvv" name="cvv" placeholder="123" required value="123">
                                </div>
                                
                                <div class="form-group">
                                    <label for="cardholder-name">Cardholder Name:</label>
                                    <input type="text" id="cardholder-name" name="cardHolderName" placeholder="John Doe" required value="John Doe">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="total-price">
                        <h3>Total Price: $<span id="total-price">0</span></h3>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Book Room</button>
                        <button type="reset" class="btn btn-secondary">Clear Form</button>
                    </div>
                </form>
            </section>
        </main>

        <!-- Loading Indicator -->
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Loading...</p>
        </div>

        <!-- Modal for booking details -->
        <div id="booking-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Booking Details</h3>
                    <span class="close" onclick="closeModal()">&times;</span>
                </div>
                <div id="modal-body" class="modal-body">
                    <!-- Booking details will be shown here -->
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">Close</button>
                    <button id="confirm-booking-btn" class="btn btn-primary" onclick="confirmBooking()">Confirm Booking</button>
                    <button id="cancel-booking-btn" class="btn btn-danger" onclick="cancelBooking()">Cancel Booking</button>
                </div>
            </div>
        </div>

        <!-- Toast notifications -->
        <div id="toast" class="toast">
            <div id="toast-message"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
